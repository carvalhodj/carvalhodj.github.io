# ---------------------------------------------------------------------------
# Site
# ---------------------------------------------------------------------------
title: Daniel Carvalho
description: >-
  Software engineer. I build distributed systems and developer tools,
  and write about the craft of making software that lasts.
lang: pt-BR                    # default language, served from the site root
url: "https://carvalhodj.github.io"                          # e.g. https://example.com
baseurl: ""

# Languages for the header switcher. `path` is the URL prefix for that
# language's pages; the default language (`lang`) has none. Interface strings
# live in _data/i18n.yml. Remove all but one entry to hide the switcher.
# `regions`: visitors from these countries get this language. `fallback`: the
# language for visitors from anywhere else.
languages:
  - code: pt-BR
    label: PT
    flag: br
    regions: [BR]
  - code: en
    label: EN
    flag: uk
    path: /en
    fallback: true

author:
  name: Daniel Carvalho

# Links rendered as [name] in the hero and footer, and listed on /contact/.
# `handle` is the text shown on the contact page (defaults to the URL).
social:
  - name: github
    handle: "@carvalhodj"
    url: https://github.com/carvalhodj
  - name: codeberg
    handle: "@carvalhodj"
    url: https://codeberg.org/carvalhodj
  - name: linkedin
    handle: in/carvalhodj
    url: https://www.linkedin.com/in/carvalhodj

# Contact form, sent by Web3Forms (free plan) with hCaptcha.
# Get an access key at https://web3forms.com, then enable hCaptcha for the
# form in the Web3Forms dashboard.
contact:
  access_key: "3a0be323-a7ac-42f2-b332-1b7c2017812f"                 # Web3Forms access key (public, safe to commit)
  subject: New message from the website

# ---------------------------------------------------------------------------
# Retro theme options
# ---------------------------------------------------------------------------
retro:
  default_font: miranda             # plex | helvetica | inter | dm-sans | miranda
  font_toggle: false              # show the typeface switcher in the header
  scanlines: true                # faint CRT scanlines (dark mode only)
  search: true                   # search button + ⌘K / Ctrl+K / "/" shortcuts
  back_to_top: true              # floating "back to top" button after scrolling
  auto_language: true            # Brazil gets Portuguese, everyone else English (until they pick a flag)
  cursor: underscore                 # blinking cursor: column (█) | bar (|) | underscore (_)
  prompt:                        # header brand: <user>@<host>:~$ <cursor>
    user: daniel
    host: 
    font: fira                   # fira | bios (IBM BIOS bitmap)
    font_toggle: false            # show the prompt font switcher in the header

# ---------------------------------------------------------------------------
# Content
# ---------------------------------------------------------------------------
permalink: /blog/:year/:title/

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "", type: projects }
    values: { layout: project }
  - scope: { path: "", type: pages }
    values: { layout: page }
  # English: pages in en/, posts in _posts/en/, projects in _projects/en/.
  - scope: { path: "en" }
    values: { lang: en }
  - scope: { path: "_posts/en" }
    values: { lang: en, permalink: "/en/blog/:year/:title/" }
  - scope: { path: "_projects/en" }
    values: { lang: en, permalink: "/en/projects/:name/" }

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

sass:
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - claude-prompt.md
  - README.md
  - LICENSE
  - "*.gemspec"
  - Gemfile
  - Gemfile.lock
  - vendor
