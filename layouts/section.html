{{ define "main" }}
<section class="page">
  <header class="page-header">
    <h1 class="page-title">{{ .Title }}</h1>
    {{- with .Description }}
    <p class="page-lede">{{ . }}</p>
    {{- end }}
  </header>

  {{ .Content }}

  <section class="section section--tight">
    {{ partial "post-list.html" .RegularPages }}
  </section>
</section>
{{ end }}
