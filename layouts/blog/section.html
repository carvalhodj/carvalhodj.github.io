{{ define "main" }}
<section class="page">
  <header class="page-header">
    <h1 class="page-title">{{ .Title | default "Blog" }}</h1>
    {{- with .Description }}
    <p class="page-lede">{{ . }}</p>
    {{- end }}
  </header>

  {{ .Content }}

  {{- range .RegularPages.GroupByDate "2006" }}
  <section class="section section--tight">
    {{ partial "section-head.html" (dict "title" .Key) }}
    {{ partial "post-list.html" .Pages }}
  </section>
  {{- end }}
</section>
{{ end }}
