{{ define "main" }}
<section class="page">
  <header class="page-header">
    <h1 class="page-title">{{ .Title | default "Work" }}</h1>
    {{- with .Description }}
    <p class="page-lede">{{ . }}</p>
    {{- end }}
  </header>

  {{ .Content }}

  <section class="section section--tight">
    {{ partial "project-list.html" (sort .RegularPages "Params.year" "desc") }}
  </section>
</section>
{{ end }}
