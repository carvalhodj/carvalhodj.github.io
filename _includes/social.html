{%- if site.social %}
<ul class="social">
  {%- for link in site.social %}
  <li><a href="{{ link.url }}"{% unless link.url contains 'mailto:' %} rel="me noopener"{% endunless %}>{{ link.name }}</a></li>
  {%- endfor %}
  {%- if include.feed %}
  <li><a href="{{ '/feed.xml' | relative_url }}">rss</a></li>
  {%- endif %}
</ul>
{%- endif %}
