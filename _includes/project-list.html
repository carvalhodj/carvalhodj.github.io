<ul class="rows">
  {%- for project in include.projects %}
  <li class="row row--project">
    <span class="row-meta">{{ project.year }}</span>
    <div class="row-body">
      <a class="row-title" href="{{ project.url | relative_url }}">{{ project.title }}</a>
      {%- if project.summary %}
      <p class="row-desc">{{ project.summary }}</p>
      {%- endif %}
    </div>
    {%- if project.stack %}
    <span class="row-aside">{{ project.stack | join: " · " }}</span>
    {%- endif %}
  </li>
  {%- endfor %}
</ul>
